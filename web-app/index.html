<!doctype html>
<html lang="en-gb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hex</title>
    <link rel="stylesheet" href="default.css">
    <script type="module" src="main.js"></script>
</head>

<body>
    <header>
        <h1 id="title">Hex</h1>
    </header>

    <!-- Left sidebar: Player 1 (Gold, top to bottom). Lights up on their turn. -->
    <aside id="player_1_panel" class="sidebar" aria-label="Player 1">
        <input id="player_1_name" class="player_name" type="text" value="Player 1"
            maxlength="18" aria-label="Edit Player 1 name">
        <span class="player_token p1" aria-hidden="true"></span>
        <p class="player_goal">Connect top to bottom</p>
        <p id="player_1_cue" class="cue" aria-hidden="true"></p>
        <table class="player_stats" aria-label="Player 1 record at this board size">
            <caption id="player_1_record_size">9 &times; 9</caption>
            <tbody>
                <tr><th scope="row">Won</th><td id="player_1_won">0</td></tr>
                <tr><th scope="row">Lost</th><td id="player_1_lost">0</td></tr>
            </tbody>
        </table>
    </aside>

    <!-- Centre: the board, with its controls underneath -->
    <main tabindex="-1">
        <!-- The board is generated by main.js. -->
        <div
            id="game_board"
            role="grid"
            aria-label="Hex board"
        ></div>

        <div id="controls">
            <button id="undo" type="button" aria-label="Undo last move">
                &#8634; Undo
            </button>
            <div class="control_group">
                <label for="board_size">Board size</label>
                <select id="board_size">
                    <option value="7">7 &times; 7</option>
                    <option value="9" selected>9 &times; 9</option>
                    <option value="11">11 &times; 11</option>
                </select>
            </div>
            <button id="restart" type="button">New game</button>
        </div>

        <!-- Announces the winner on screen; also a live region that tells
             screen-reader users the turn and swap option (hidden in play). -->
        <p id="turn_status" class="turn_status" aria-live="polite"></p>
    </main>

    <!-- Right sidebar: Player 2 (Black, left to right). Lights up on their turn. -->
    <aside id="player_2_panel" class="sidebar" aria-label="Player 2">
        <input id="player_2_name" class="player_name" type="text" value="Player 2"
            maxlength="18" aria-label="Edit Player 2 name">
        <span class="player_token p2" aria-hidden="true"></span>
        <p class="player_goal">Connect left to right</p>
        <p id="player_2_cue" class="cue" aria-hidden="true"></p>
        <table class="player_stats" aria-label="Player 2 record at this board size">
            <caption id="player_2_record_size">9 &times; 9</caption>
            <tbody>
                <tr><th scope="row">Won</th><td id="player_2_won">0</td></tr>
                <tr><th scope="row">Lost</th><td id="player_2_lost">0</td></tr>
            </tbody>
        </table>
    </aside>

    <!-- Asked only when a game is in progress, before it is discarded. -->
    <dialog id="confirm_dialog" aria-labelledby="confirm_heading">
        <h2 id="confirm_heading">Start a new game?</h2>
        <p id="confirm_message">
            Are you sure? Your current game will be lost.
        </p>
        <div class="dialog_buttons">
            <button id="confirm_cancel" type="button" autofocus>
                Keep playing
            </button>
            <button id="confirm_start" type="button">Start new game</button>
        </div>
    </dialog>
</body>

</html>
